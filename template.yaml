AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  hogwarts-notifications-service

  SAM template for the Hogwarts Notifications Service

Globals:
  Function:
    Timeout: 3
    LoggingConfig:
      LogFormat: JSON

Resources:
  NotificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: notifications
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: recipient
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: recipient
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: notifications-dlq

  NotificationsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: notifications-queue
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5

  CreateNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: create-notification/
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          NOTIFICATIONS_TABLE_NAME: !Ref NotificationsTable
          NOTIFICATIONS_QUEUE_URL: !Ref NotificationsQueue
          DLQ_URL: !Ref DeadLetterQueue
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt NotificationsTable.Arn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NotificationsQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DeadLetterQueue.QueueName
      Events:
        CreateNotificationApi:
          Type: Api
          Properties:
            Path: /notifications
            Method: post

  GetNotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get-notifications/
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          NOTIFICATIONS_TABLE_NAME: !Ref NotificationsTable
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource: !GetAtt NotificationsTable.Arn
      Events:
        GetNotificationsApi:
          Type: Api
          Properties:
            Path: /notifications/{recipient}
            Method: get

  DeliveryConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: delivery-consumer/
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          NOTIFICATIONS_TABLE_NAME: !Ref NotificationsTable
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt NotificationsTable.Arn
      Events:
        NotificationsQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationsQueue.Arn
            BatchSize: 10

Outputs:
  CreateNotificationApi:
    Description: API Gateway endpoint URL for the create notification function
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/notifications"

  CreateNotificationFunctionArn:
    Description: ARN of the create notification Lambda function
    Value: !GetAtt CreateNotificationFunction.Arn

  CreateNotificationFunctionIamRole:
    Description: IAM role created for the create notification function
    Value: !GetAtt CreateNotificationFunctionRole.Arn

  NotificationsTableName:
    Description: DynamoDB table name for notifications
    Value: !Ref NotificationsTable